[tool:pytest]
# Enhanced pytest configuration with comprehensive Allure integration

# Test Discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    ui: UI tests using Selenium WebDriver
    api: API tests using requests library
    integration: Integration tests combining UI and API
    performance: Performance and load tests
    smoke: Smoke tests for critical functionality
    regression: Regression tests for full coverage
    sanity: Sanity tests for quick validation
    slow: Tests that take longer to execute
    network: Tests requiring network connectivity
    database: Tests requiring database connection
    security: Security-related tests
    accessibility: Accessibility tests
    cross_browser: Cross-browser compatibility tests
    mobile: Mobile-specific tests
    desktop: Desktop-specific tests

# Allure Configuration
addopts = 
    --alluredir=allure-results
    --clean-alluredir
    --tb=short
    --verbose
    --strict-markers
    --disable-warnings
    --maxfail=10
    --capture=no
    --show-capture=no
    --log-cli-level=INFO
    --log-file=logs/pytest_run.log
    --html=reports/pytest_report.html
    --self-contained-html

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_detailed.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Test Execution
minversion = 6.0
required_plugins = 
    pytest-html
    pytest-allure-adaptor
    pytest-selenium
    pytest-xdist
    pytest-rerunfailures
    pytest-timeout

# Timeout Configuration
timeout = 300
timeout_method = thread

# Rerun Configuration
reruns = 0
reruns_delay = 1

# Parallel Execution
# Uncomment the following lines for parallel execution
# numprocesses = auto
# dist = loadscope

# Coverage Configuration (if using pytest-cov)
# addopts = --cov=project --cov-report=html --cov-report=xml

# Console Output
console_output_style = progress
junit_family = xunit2

# Filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Custom Configuration
# Test data directory
test_data_dir = config

# Screenshots directory
screenshots_dir = screenshots

# Reports directory
reports_dir = reports

# Logs directory
logs_dir = logs

# Allure specific settings
allure_link_pattern = https://example.com/{issue_id}
allure_test_id_pattern = TST-{test_id}
allure_story_id_pattern = STR-{story_id}

# Browser Configuration (for UI tests)
browser = chrome
headless = false
window_size = 1920,1080
implicit_wait = 10
explicit_wait = 30

# API Configuration (for API tests)
api_timeout = 30
api_retry_count = 3
api_retry_delay = 1

# Environment Configuration
environment = test
base_url = https://practice.expandtesting.com
api_base_url = https://practice.expandtesting.com/notes/api

# Reporting Configuration
generate_html_report = true
generate_allure_report = true
attach_screenshots = true
attach_logs = true
attach_api_responses = true
attach_browser_logs = true

# Performance Configuration
performance_threshold = 2.0
performance_detailed_metrics = true

# Debug Configuration
debug_mode = false
trace_execution = false
capture_network_logs = false
