[pytest]
# Pytest Configuration File

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --alluredir=allure-results
    --html=reports/report.html
    --self-contained-html
    --maxfail=5
    --durations=10

# Markers
markers =
    smoke: Marks tests as smoke tests
    regression: Marks tests as regression tests
    critical: Marks tests as critical for business
    high: Marks tests as high priority
    medium: Marks tests as medium priority
    low: Marks tests as low priority
    ui: Marks tests as UI tests
    api: Marks tests as API tests
    e2e: Marks tests as end-to-end tests
    login: Marks tests related to login functionality
    notes: Marks tests related to notes functionality
    slow: Marks tests that run slowly
    flaky: Marks tests that are known to be flaky
    skip_ci: Marks tests to be skipped in CI environment

# Minimum version required
minversion = 6.0

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration (if using pytest-cov)
# addopts = --cov=project --cov-report=html --cov-report=term-missing

# Parallel execution (if using pytest-xdist)
# addopts = -n auto

# Timeout configuration (if using pytest-timeout)
# timeout = 300
# timeout_method = thread

# Retry configuration (if using pytest-rerunfailures)
# reruns = 2
# reruns_delay = 5

# Custom configuration
# junit_family = xunit2
# junit_logging = all
# junit_log_passing_tests = true
