[tool:pytest]
# Parallel Execution Configuration
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=10
    --capture=no
    --log-cli-level=INFO
    --log-cli-format=%(asctime)s [%(levelname)8s] %(name)s: %(message)s
    --log-cli-date-format=%Y-%m-%d %H:%M:%S

# Test Discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Marks tests as smoke tests (quick sanity checks)
    regression: Marks tests as regression tests (full suite)
    critical: Marks tests as critical (must pass)
    parallel: Marks tests suitable for parallel execution
    sequential: Marks tests that must run sequentially
    slow: Marks tests that take a long time to run
    api: Marks API tests
    ui: Marks UI tests
    login: Marks login-related tests
    notes: Marks notes-related tests
    performance: Marks performance tests
    grid: Marks tests for Selenium Grid execution
    browserstack: Marks tests for BrowserStack execution
    saucelabs: Marks tests for Sauce Labs execution

# Parallel Execution Settings
# These are used when running with pytest-xdist
# Usage: pytest -n auto  # Auto-detect CPU count
# Usage: pytest -n 4     # Use 4 workers
# Usage: pytest -n logical  # Use logical CPU count

# Timeout Configuration
timeout = 300
timeout_method = thread

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_parallel.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# HTML Reporting
html_report = reports/parallel_report.html
self_contained_html = true

# Allure Reporting
allure_report_dir = allure-results/parallel

# Coverage Configuration
# addopts = --cov=pages --cov=tests --cov-report=html --cov-report=term-missing

# Browser Configuration (can be overridden via command line)
browser = chrome
headless = false
window_size = 1920,1080
implicit_wait = 10
explicit_wait = 30

# Selenium Grid Configuration
selenium_grid_enabled = false
selenium_grid_url = http://localhost:4444
selenium_grid_max_sessions = 4
selenium_grid_browser_timeout = 300

# Cloud Provider Configuration
cloud_provider = none
browserstack_enabled = false
saucelabs_enabled = false

# Performance Configuration
performance_enabled = false
performance_threshold = 2.0
performance_report_format = json

# Parallel Execution Strategy
# Options: load, loadscope, loadfile, no
dist = loadscope

# Test Distribution
# Controls how tests are distributed among workers
# load: Distribute by test load (default)
# loadscope: Distribute by scope (module, class)
# loadfile: Distribute by file
# no: No distribution (sequential)

# Worker Configuration
# These settings optimize worker performance
worker_input_timeout = 60
worker_restart_interval = 100

# Error Handling
maxfail = 10
continue_on_error = false

# Output Configuration
console_output_style = progress
showlocals = false
showcapture = no

# Debugging
# Uncomment the following lines for debugging parallel execution issues
# addopts = --pdb --pdbcls=IPython.terminal.debugger:Pdb
# addopts = --traceconfig

# Integration with CI/CD
# These settings are optimized for CI/CD environments
# junit_family = xunit2
# junit_logging = all
# junit_log_passing_tests = true

# Custom Configuration Files
# conftest_parallel.py - Parallel execution fixtures
# selenium_grid_config.py - Selenium Grid configuration
# parallel_test_runner.py - Advanced test runner

# Environment Variables for Parallel Execution
# PYTEST_XDIST_WORKER - Current worker ID
# PYTEST_XDIST_WORKER_COUNT - Total number of workers
# PYTEST_CURRENT_TEST - Currently running test
# PYTEST_TEST_NAME - Name of the current test

# Example Usage Commands:
# 
# Local parallel execution:
# pytest -n auto
# pytest -n 4 --browser chrome
# pytest -n 2 tests/test_login_*.py
#
# Selenium Grid execution:
# pytest -n 4 --selenium-grid-enabled=true --selenium-grid-url=http://localhost:4444
#
# Cloud execution:
# pytest -n 2 --cloud-provider=browserstack
# pytest -n 2 --cloud-provider=saucelabs
#
# Mixed execution:
# pytest -n auto -m "parallel and not sequential"
# pytest -n 4 -m "smoke and parallel"
#
# Performance testing:
# pytest -n 2 -m "performance and parallel" --performance-enabled=true

# Resource Management
# These settings help manage system resources during parallel execution
max_parallel_processes = 8
memory_limit = 4G
cpu_limit = 80%

# Test Isolation
# Each worker gets isolated resources to prevent interference
test_isolation = true
worker_isolation = true
browser_isolation = true

# Reporting Configuration
# Enhanced reporting for parallel execution
parallel_report = true
worker_report = true
consolidated_report = true

# Retry Configuration
# Retry failed tests up to 3 times
retry_count = 3
retry_delay = 1

# Monitoring and Metrics
# Enable monitoring for parallel execution
monitoring_enabled = true
metrics_collection = true
performance_metrics = true
