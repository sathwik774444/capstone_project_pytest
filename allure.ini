[allure]
# Allure configuration file

# Directory for Allure results
allure_results_dir = allure-results

# Allure report configuration
allure_report_dir = allure-report

# Test suite configuration
allure_suite_name = Notes Application Test Suite

# Test environment
allure_environment = test

# Link patterns
allure_link_pattern = https://example.com/{issue}
allure_link_tms_pattern = https://tms.example.com/{tms}
allure_link_case_pattern = https://testcase.example.com/{case}

# Plugins
allure_plugins = junit, xunit, html

# Logging configuration
allure_logging_level = INFO

# Custom properties
allure_custom_properties = true
